<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getnet Support</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#272b36; --txt:#e6e8ee; --muted:#9aa3b2;
          --me:#2b6cff; --bot:#1f2430; --accent:#34d399; }
  * { box-sizing:border-box; } html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; height:100vh; display:flex; flex-direction:column; padding:16px; }
  header { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  #log { flex:1; overflow-y:auto; padding:16px 2px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  .meta a { color:var(--accent); text-decoration:none; }
  form { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); }
  input, button { font:inherit; border-radius:10px; border:1px solid var(--line); }
  input { flex:1; padding:11px 13px; background:var(--panel); color:var(--txt); }
  button { padding:11px 16px; background:var(--me); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  #login { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; margin:auto 0; }
  #login h2 { margin:0 0 4px; font-size:15px; } #login p { margin:0 0 14px; color:var(--muted); font-size:13px; }
  #login .row { display:flex; gap:8px; }
  .hide { display:none !important; }
  .err { color:#f87171; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="dot"></span><h1>Getnet merchant support</h1></header>

  <div id="login">
    <h2>Sign in</h2>
    <p>Use the demo merchant credentials printed by <code>make creds</code>.</p>
    <div class="row">
      <input id="user" placeholder="user id (e.g. cliente1988)" autocomplete="username">
      <input id="pass" type="password" placeholder="password" autocomplete="current-password">
      <button id="loginBtn">Enter</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="log" class="hide"></div>
  <form id="chat" class="hide">
    <input id="text" placeholder="Ask about your Getnet account, machines, Pix…" autocomplete="off">
    <button id="send">Send</button>
  </form>
</div>

<script>
// Minimal single-file client for the /chat API. No build, no dependencies.
const S = { token: null, userId: null, conversationId: null };
const $ = (id) => document.getElementById(id);

async function login() {
  const u = $("user").value.trim(), p = $("pass").value;
  $("loginErr").textContent = "";
  if (!u || !p) { $("loginErr").textContent = "Enter user id and password."; return; }
  try {
    const r = await fetch("/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p }),
    });
    if (!r.ok) { $("loginErr").textContent = r.status === 429 ? "Too many attempts, wait a moment." : "Invalid credentials."; return; }
    const data = await r.json();
    S.token = data.access_token; S.userId = u;
    $("login").classList.add("hide"); $("log").classList.remove("hide"); $("chat").classList.remove("hide");
    $("text").focus();
    addBot("Hi — ask me about your Getnet account, machines, fees, Pix or anticipation.", null);
  } catch (e) { $("loginErr").textContent = "Cannot reach the server."; }
}

function addMsg(text, cls) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d; }
function addBot(text, info) {
  const d = addMsg(text, "bot");
  if (info && (info.sources?.length || info.agents?.length)) {
    const m = document.createElement("div"); m.className = "meta";
    const parts = [];
    if (info.agents?.length) parts.push("via " + info.agents.join(" → "));
    if (info.sources?.length) parts.push("sources: " + info.sources.map((s, i) => `[${i + 1}]`).join(" "));
    m.textContent = parts.join("  ·  "); d.appendChild(m);
  }
}

async function send(ev) {
  ev.preventDefault();
  const text = $("text").value.trim(); if (!text) return;
  addMsg(text, "me"); $("text").value = ""; $("send").disabled = true;
  const thinking = addMsg("…", "bot");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.token },
      body: JSON.stringify({ message: text, user_id: S.userId, conversation_id: S.conversationId }),
    });
    const data = await r.json();
    S.conversationId = data.conversation_id || S.conversationId;
    thinking.remove();
    addBot(data.answer || "(no answer)", data);
  } catch (e) { thinking.remove(); addBot("The assistant is unavailable right now.", null); }
  $("send").disabled = false; $("text").focus();
}

$("loginBtn").addEventListener("click", login);
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("chat").addEventListener("submit", send);
</script>
</body>
</html>
